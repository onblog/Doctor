<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="128" height="128" role="img" aria-label="医疗知识图谱">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#43a06a" />
      <stop offset="100%" stop-color="#1d6b47" />
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <clipPath id="card"><rect width="32" height="32" rx="9" /></clipPath>
  </defs>

  <rect width="32" height="32" rx="9" fill="url(#bg)" />
  <rect width="32" height="16" rx="9" fill="url(#shine)" />

  <g clip-path="url(#card)" transform="translate(-2.4 -2.7) scale(1.15)">
    <!-- 白大褂 -->
    <path d="M4.6 32c0-6.2 5.1-9.8 11.4-9.8s11.4 3.6 11.4 9.8Z" fill="#f7fbf8" />
    <!-- 领口 -->
    <path d="M13.9 22.8 16 25.4l2.1-2.6-1-.6-1.1 1.4-1.1-1.4Z" fill="#d8ebdf" />
    <!-- 脖子 -->
    <path d="M13.5 16.8h5v4.6a2.5 2.5 0 0 1-5 0Z" fill="#e6b294" />
    <!-- 脸 -->
    <circle cx="16" cy="12.2" r="6.8" fill="#f7d9c4" />
    <!-- 头发 -->
    <path d="M9.2 11A6.8 6.8 0 0 1 22.8 11Z" fill="#31413a" />
    <!-- 眼睛 -->
    <circle cx="13.6" cy="13.3" r=".9" fill="#31413a" />
    <circle cx="18.4" cy="13.3" r=".9" fill="#31413a" />
    <!-- 微笑 -->
    <path d="M14.1 15.8a2.2 2.2 0 0 0 3.8 0a2.9 2.9 0 0 1-3.8 0Z" fill="#b4654a" />
    <!-- 听诊器 -->
    <path d="M12.4 23.6h1.3v2.2a2.3 2.3 0 0 0 4.6 0v-2.2h1.3v2.2a3.6 3.6 0 0 1-7.2 0Z" fill="#1d6b47" />
    <circle cx="16" cy="28.4" r="1.7" fill="#1d6b47" />
    <circle cx="16" cy="28.4" r=".6" fill="#f7fbf8" />
  </g>
</svg>
